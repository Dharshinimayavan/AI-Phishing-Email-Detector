
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PhishGuard | Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .logo {
            font-size: 26px;
            font-weight: 700;
            color: #2563eb;
        }

        .logo span {
            color: #0f172a;
        }

        .subtitle {
            margin-top: 8px;
            color: #64748b;
            font-size: 14px;
        }

        .login-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        .login-card h2 {
            color: #0f172a;
            font-size: 22px;
            margin-bottom: 7px;
        }

        .description {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 11px 13px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #334155;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            color: #1e293b;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }

        .login-button {
            width: 100%;
            padding: 13px;
            margin-top: 5px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #64748b;
        }

        .register-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .security-note {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 11px;
            line-height: 1.5;
        }

        @media (max-width: 500px) {

            .login-card {
                padding: 24px;
            }

            .logo {
                font-size: 23px;
            }

        }

    </style>

</head>


<body>

    <div class="login-container">


        <div class="logo-section">

            <div class="logo-icon">
                🛡️
            </div>

            <div class="logo">
                Phish<span>Guard</span>
            </div>

            <div class="subtitle">
                AI-Based Phishing Email Detection
            </div>

        </div>


        <div class="login-card">

            <h2>
                Welcome Back
            </h2>

            <p class="description">
                Login to access your phishing email security dashboard.
            </p>


            {% if error %}

            <div class="error-message">
                ⚠️ {{ error }}
            </div>

            {% endif %}


            <form method="POST">


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    🔐 Login
                </button>


            </form>


            <div class="register-link">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </div>

        </div>


        <div class="security-note">

            🔒 Your account information is protected using
            secure password hashing.

        </div>


    </div>

</body>

</html>
